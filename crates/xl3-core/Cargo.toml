[package]
name = "xl3-core"
version = "0.2.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Pure-Rust XLSX template rendering engine (acceleration core for xl3)"
documentation = "https://docs.rs/xl3-core"
readme = "README.md"
keywords = ["xlsx", "excel", "template", "spreadsheet", "rendering"]
categories = ["template-engine", "encoding", "wasm"]

[dependencies]
anyhow = "1.0.102"
calamine = "0.35"
quick-xml = "0.39"
rust_xlsxwriter = "0.95"
# XLSX uses store + deflate only — turn off zstd / lzma / bzip2 etc.
# so the wasm32 build doesn't pull in a C-toolchain dependency that
# clang can't satisfy when targeting wasm32-unknown-unknown.
zip = { version = "7", default-features = false, features = ["deflate"] }

# `SystemTime::now()` panics on `wasm32-unknown-unknown` (no WASI
# clock); pull in js-sys when targeting wasm so `TODAY()` can read
# `Date.now()` from the host. Native consumers (CLI / Tauri / PyO3)
# don't compile this dep.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
js-sys = "0.3"

[dev-dependencies]
# tests/ghost_style.rs inspects the rendered XLSX at the XML level
# (styles.xml fills/borders + worksheet cell elements) — same crates
# the lib already depends on, so this adds nothing to the build tree.
quick-xml = "0.39"
zip = { version = "7", default-features = false, features = ["deflate"] }

[lib]
path = "src/lib.rs"
